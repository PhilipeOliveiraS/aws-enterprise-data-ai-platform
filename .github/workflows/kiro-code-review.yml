name: Kiro Enterprise CI/CD Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  kiro-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Run Kiro Headless Validation
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          kiro-cli chat \
            --agent cicd-agent \
            --no-interactive \
            "Perform a strict CI/CD validation on the latest changes. Check for security flaws, ensure IaC files meet standards, and output a markdown summary of your findings."
